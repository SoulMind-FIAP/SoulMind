<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/contato.css">
    <title>Soul Mind</title>
</head>
<body>
    <header>
    <div class="logo">
      <img src="../image/logo.png" alt="Logo SoulMind">
    </div>
    <nav>
      <a  href="../index.html">INÍCIO</a>
      <a href="assistente.html">AVATAR</a>
      <a href="quem-somos.html">QUEM SOMOS</a>
      <a href="sobre.html">SOBRE</a>
      <a href="FaQ.html">FAQ</a>
      <a class="active" href="contato.html">CONTATO</a>
    </nav>
  </header>
      <main class="contato-pagina">
 
        <!-- TÍTULO -->
        <h1 class="contato-titulo">
            <i class="fa-solid fa-envelope icone-titulo"></i> Entre em contato
        </h1>
 
        <!-- LINHA COM FORMULÁRIO + OUTRAS FORMAS -->
        <div class="contato-linha">
 
            <!-- FORMULÁRIO -->
            <div class="formulario-box">
                <div class="campo">
                    <label for="name">Nome completo</label>
                    <input type="text" id="name" placeholder="Digite seu nome completo">
                </div>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail">
                </div>
                <div class="campo">
                    <label for="subject">Assunto</label>
                    <input type="text" id="subject" placeholder="Digite o assunto da mensagem">
                </div>
                <div class="campo">
                    <label for="message">Mensagem</label>
                    <textarea id="message" rows="6" placeholder="Escreva sua mensagem"></textarea>
                </div>
                <button type="submit">Enviar mensagem</button>
            </div>
 
            
        <!-- BANNER FINAL -->
        <div class="banner-final">
            <div class="banner-texto">
                <h2>Vamos juntos transformar o mundo!</h2>
                <p>Sua mensagem é muito importante para nós.</p>
            </div>
            <div class="banner-robo">
                <img src="../image/robo-contato.png" alt="Robô SoulMind">
            </div>
        </div>
 
    </main>
</body>
</html>
