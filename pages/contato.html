    <h1>Entre em contato</h1>
    <main>
        <form>
            <div container do forms>
                <label for="name">Nome completo</label>
                <input type="text" id="name" placeholder="Digite seu nome completo">
            </div>
            <div contaner do forms>
                <label for="email">E-mail</label>
                <input type="text" id="email" placeholder="Digite seu e-mail">
            </div>

            <div container do forms>
                <label for="subject">Assunto</label>
                <input type="text" id="subject" placeholder="Digite o assunto da mensagem">
            </div>
            
            <div container do forms>
                <label for="message">Mensagem</label>
                <input type="text" id="message" placeholder="Escreva sua mensagem">
            </div>

            <button type="submit">Enviar mensagem</button>

        </form>

        <section outras formas de contato>

            <h2>Outras formas de contato</h2>
            
            <div>
                //<a logo do email></a>

            </div>
            
            <div>
                <a logo do instagram></a>
            <h3>Instagram</h3>
            <h4>@soulmind</h4>
            </div>
            
            <div>
                <a logo do linkedin></a>
                <h3>LinkedIn</h3>
                <h4>SoulMind</h4>
            </div>

            <div>
                <a logo da localizacao></a>
                <h3>Localização</h3>
                <h4>São Paulo - SP</h4>
            </div>
        </section>

        <section Banner de baixo>

            <h2>Vamos juntos transformar o mundo!</h2>

            <a foto do robo da direita></a>
        </section>
