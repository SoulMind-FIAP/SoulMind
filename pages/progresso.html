<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/progresso.css">
    <title>Document</title>
</head>
<body>
    <header>
    <div class="logo">
      <img src="../image/logo.png" alt="Logo SoulMind">
    </div>
    <nav>
      <a  href="../index.html">INÍCIO</a>
      <a class="active" href="./pages/assistente.html">AVATAR</a>
      <a href="#">QUEM SOMOS</a>
      <a href="#">SOBRE</a>
      <a href="#">FAQ</a>
      <a href="#">CONTATO</a>
    </nav>
  </header>
      <main class="conteudo">
            <div class="card card-robo">
                <img src="../image/robo-progresso.png" alt="Robô SoulMind" class="img-robo">
                <div class="texto-boas-vindas">
                    <p class="ola">Olá, Juliana!</p>
                    <p class="frase">Vamos transformar o mundo hoje?</p>
                </div>
            </div>
            <div class="card card-stats">
                <div class="stat">
                    <span class="stat-numero">70</span>
                    <span class="stat-label">Pontos</span>
                </div>
                <div class="divisor"></div>
                <div class="stat">
                    <span class="stat-numero">24</span>
                    <span class="stat-label">Missões</span>
                </div>
                <div class="divisor"></div>
                <div class="stat">
                    <span class="stat-numero">8</span>
                    <span class="stat-label">Conquistas</span>
                </div>
            </div>
            <div class="card card-progresso">
                <p class="card-titulo">Seu progresso</p>
                <div class="linha-progresso">
                    <div class="circulo-wrap">
                        <svg class="circulo-svg" viewBox="0 0 100 100">
                            <circle class="anel-fundo" cx="50" cy="50" r="40"></circle>
                            <circle class="anel-prog" cx="50" cy="50" r="40" id="anelProg"></circle>
                        </svg>
                        <span class="porcento">100%</span>
                    </div>
                    <p class="texto-prog">Continue completando missões e ganhe recompensas</p>
                </div>
            </div>
            <div class="card card-conquistas">
                <p class="card-titulo">Conquistas recentes</p>
                <div class="lista-conquistas">
                    <div class="conquista" title="Plantador">
                        <span class="icone-conquista verde">🌿</span>
                    </div>
                    <div class="conquista" title="Poupador de Água">
                        <span class="icone-conquista azul">💧</span>
                    </div>
                    <div class="conquista" title="Reciclador">
                        <span class="icone-conquista verde-claro">♻️</span>
                    </div>
                </div>
            </div>
        </main>
</body>
</html>
